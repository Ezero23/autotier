<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Code 供应商切换器</title>
    <script>(function(){try{var k="autotier-theme";var t=localStorage.getItem(k)||localStorage.getItem("cc-switch-theme")||"system";if(!localStorage.getItem(k)&&localStorage.getItem("cc-switch-theme")){localStorage.setItem(k,localStorage.getItem("cc-switch-theme"));}var d=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("dark",d);}catch(e){}})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
